name: Bug
description: Something is not working as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you expected and what actually happens. A screenshot helps (without private chat titles).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: system
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: herdr-app and Node versions
      placeholder: herdr-app 0.1.16, Node 24
